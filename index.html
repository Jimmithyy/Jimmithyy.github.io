<script>
const videos = [
    "vid1.mp4","vid2.mp4","vid3.mp4","vid4.mp4","vid5.mp4","vid6.mp4",
    "vid7.mp4","vid8.mp4","vid9.mp4","vid10.mp4","vid11.mp4","vid12.mp4","vid13.mp4"
];

let currentVideo = 0;
const videoPlayer = document.getElementById("heroVideo");

function playNextVideo() {
    videoPlayer.src = videos[currentVideo];
    videoPlayer.load();
    videoPlayer.play();

    currentVideo++;
    if (currentVideo >= videos.length) currentVideo = 0;
}

videoPlayer.addEventListener("ended", playNextVideo);
playNextVideo();
</script>
